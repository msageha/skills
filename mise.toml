# ツールのバージョンは Renovate (mise manager) が bump する。latest 指定にしない。
# checksum の再解決は mise-lock.yaml (週次) が行う。
# ローカルだけの値は mise.local.toml (git 管理外) を併置して上書きできる。
[tools]
prek = "0.4.10"
actionlint = "1.7.12"
dprint = "0.55.2"
# actionlint が shell script の検査に呼ぶ
shellcheck = "0.11.0"

# install タスクは bash 前提 ($HOME 展開・.sh の直接実行) なので、Windows の既定 inline shell (cmd /c) を使わず bash を指定する
[tasks.install-claude]
description = "Symlink all skills into ~/.claude/skills"
run = 'scripts/install-skills.sh link "$HOME/.claude/skills"'
shell = "bash -c"

[tasks.install-codex]
description = "Symlink all skills into ~/.codex/skills"
run = 'scripts/install-skills.sh link "$HOME/.codex/skills"'
shell = "bash -c"

[tasks.install-agy]
description = "Symlink all skills into ~/.gemini/antigravity-cli/skills"
run = 'scripts/install-skills.sh link "$HOME/.gemini/antigravity-cli/skills"'
shell = "bash -c"

[tasks.install-openclaw]
description = "Copy all skills into ~/.openclaw/workspace/skills (its loader rejects symlinks that resolve outside the workspace unless skills.load.allowSymlinkTargets is set)"
run = 'scripts/install-skills.sh copy "$HOME/.openclaw/workspace/skills"'
shell = "bash -c"

[tasks.docs]
description = "Sync the task list embedded in README.md with mise.toml"
run = "mise generate task-docs --inject --output README.md"

[hooks]
postinstall = "prek install"

[settings]
lockfile = true
