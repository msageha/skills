name: mise lock

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC
  pull_request:
    paths:
      - mise.toml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mise-lock:
    # fork からの PR は GITHUB_TOKEN で push できず head ブランチの checkout もできないため対象外
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # push は下段のステップで明示的にトークンを渡して行うため、
      # チェックアウトに認証情報を残さない。
      # schedule / workflow_dispatch は起動時に選んだ ref ではなく main を基点にする
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          persist-credentials: false

      # 注意: org の Actions 許可設定 (allowed_actions: selected) で
      # jdx/mise-action@* を patterns_allowed に許可している必要がある。
      # install: false — 古い mise.lock のまま mise install すると checksum 不一致で
      # 失敗しうるため、mise 本体のみ導入して lock の再生成だけを行う。
      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: false
          cache: false

      # mise.toml のバージョン更新は Renovate に任せる。
      # ここでは pin されたバージョンのまま mise.lock の checksum / URL だけを再生成する。
      - name: Run mise lock
        env:
          # mise の GitHub API アクセス (リリース取得・SLSA 検証) を認証付きにして
          # ランナー共有 IP の無認証 rate limit (60 req/h) を回避する
          GITHUB_TOKEN: ${{ github.token }}
        run: mise lock

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mise.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit mise.lock
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mise.lock
          git commit -m "chore: update mise.lock"

      # 以下の push / PR 作成は GITHUB_TOKEN で行うため、それが起こす pull_request run は
      # approval-required 状態で作られ、write 権限のあるユーザーが Actions 上で承認するまで
      # CI は走らない (GitHub 仕様。workflow_dispatch で代替しても required check には数えられない)。

      # Renovate 等が mise.toml を変更した既存 PR には、
      # 同じブランチに直接 push して mise.lock を追従させる。
      - name: Push to the pull request branch
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$HEAD_REF"

      # schedule / workflow_dispatch では新規に PR を作る。
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/chore/mise-lock

          if ! gh pr view chore/mise-lock --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --title "chore: update mise.lock" --base main --head chore/mise-lock \
              --body "mise lock の自動実行による mise.lock の更新です。差分を確認し、approval-required になっている CI run を承認してください。"
          fi
