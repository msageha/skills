name: prek

# ci.yaml から reusable workflow として呼び出される。
# push / pull_request / workflow_dispatch のトリガーは ci.yaml 側が持つ。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 注意: org の Actions 許可設定 (allowed_actions: selected) で
      # jdx/mise-action@* を patterns_allowed に許可している必要がある。
      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      - name: Run prek
        run: mise exec -- prek run --all-files
