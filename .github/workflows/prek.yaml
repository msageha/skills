name: prek

# ci.yaml から reusable workflow として呼び出される。
# push / pull_request / workflow_dispatch のトリガーは ci.yaml 側が持つ。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # 注意: org の Actions 許可設定 (allowed_actions: selected) で
      # jdx/mise-action@* を patterns_allowed に許可している必要がある。
      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true

      - name: Run prek
        run: mise exec -- prek run --all-files
