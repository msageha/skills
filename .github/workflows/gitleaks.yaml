name: Secret scan

on:
  # ci.yaml から reusable workflow として呼び出される。
  # push / pull_request / workflow_dispatch のトリガーは ci.yaml 側が持つ。
  workflow_call:
  # main の履歴全体を週次で再スキャンする。image は digest 固定なので、検知ルールは
  # Renovate が image を更新したときに変わり、次の週次実行で新規 push なしに全履歴へ適用される
  schedule:
    - cron: "0 1 * * 1" # 毎週月曜 01:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: gitleaks git --redact -v .
